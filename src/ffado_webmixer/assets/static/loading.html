<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ffado-webmixer</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg">


<link id="themeStylesheet" data-base="../themes/" rel="stylesheet" href="../themes/dark.css">
<script src="themes.js"></script>
<script src="loading.js"></script>
<link rel="stylesheet" href="loading.css">
</head>

<body>

<div class="startup">

  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="5" y="5" width="4" height="22" rx="2" fill="var(--pin-color)"/>
      <rect x="14" y="9" width="4" height="14" rx="2" fill="var(--accent-color)"/>
      <rect x="23" y="3" width="4" height="26" rx="2" fill="var(--fader-value-color)"/>

      <rect x="3" y="13" width="8" height="3" rx="1.5" fill="var(--text-primary)"/>
      <rect x="12" y="7" width="8" height="3" rx="1.5" fill="var(--text-primary)"/>
      <rect x="21" y="18" width="8" height="3" rx="1.5" fill="var(--text-primary)"/>
    </svg>
  </div>

  <div class="title">ffado-webmixer</div>
  <div class="subtitle">Initializing mixer</div>

  <div class="status">
    <div class="indicator"></div>
    <span>Waiting for mixer server...</span>
  </div>

  <div class="meter"></div>

  <div class="version">WEB INTERFACE FOR FFADO</div>

</div>

</body>
</html>
